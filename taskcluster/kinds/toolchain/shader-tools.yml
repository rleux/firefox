---
task-defaults:
    attributes:
        local-toolchain: true
    description: "WebRender GLSL and SPIR-V host tools"
    worker-type: b-linux-docker-amd
    worker:
        max-run-time: 1800
    run:
        script: build-shader-tools.sh
        toolchain-artifact: public/build/shader-tools.tar.zst
    fetches:
        fetch:
            - webrender-glslang
            - webrender-spirv-tools
            - webrender-spirv-headers

linux64-shader-tools:
    treeherder:
        symbol: TL(shader-tools)
    run:
        arguments: ['x86_64-linux-gnu']
    fetches:
        toolchain:
            - linux64-clang-toolchain
            - sysroot-x86_64-linux-gnu

linux64-aarch64-shader-tools:
    treeherder:
        symbol: TLA64(shader-tools)
    run:
        arguments: ['aarch64-linux-gnu']
    fetches:
        toolchain:
            - linux64-clang-toolchain
            - sysroot-aarch64-linux-gnu
