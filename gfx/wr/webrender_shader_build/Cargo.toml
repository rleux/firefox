[package]
name = "webrender_shader_build"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Host-side Vulkan shader compilation for WebRender"

[features]
default = []
glslang = []
# Reads Firefox's actual vendored core shader in the required host-test job.
gecko-core-shader-tests = ["glslang", "dep:naga", "naga/wgsl-in", "naga/spv-out", "dep:wgpu-naga-bridge", "dep:wgpu-types"]

[dependencies]
webrender_build = { path = "../webrender_build", features = ["vulkan"] }
regex = "1.11.1"

naga = { git = "https://github.com/gfx-rs/wgpu", rev = "4fe54b0207a2ec7e0d65af900b1218b3c1529699", optional = true }
wgpu-naga-bridge = { git = "https://github.com/gfx-rs/wgpu", rev = "4fe54b0207a2ec7e0d65af900b1218b3c1529699", optional = true }
wgpu-types = { git = "https://github.com/gfx-rs/wgpu", rev = "4fe54b0207a2ec7e0d65af900b1218b3c1529699", optional = true, default-features = false, features = ["std"] }
