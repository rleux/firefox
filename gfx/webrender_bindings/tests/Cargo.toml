[package]
name = "webrender-bindings-gtest"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[features]
vulkan = ["dep:webrender", "dep:wgpu-hal", "webrender/vulkan"]

[dependencies]
webrender = { path = "../../wr/webrender", default-features = false, optional = true }
wgpu-hal = { git = "https://github.com/gfx-rs/wgpu", rev = "49325ca0a13bdc0787b1601138096cce743dd29e", optional = true, default-features = false, features = ["vulkan", "validation_canary"] }

[lib]
path = "lib.rs"
test = false
doctest = false
