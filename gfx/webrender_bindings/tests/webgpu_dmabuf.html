<meta charset="utf-8"><title>WebGPU compositor test</title>
<style>
html, body { margin: 0; block-size: 100%; background: white; }
canvas { display: block; inline-size: 100vw; block-size: 100vh; }
</style><canvas width="256" height="128"></canvas>
<script>
window.gpuErrors = [];
window.ready = (async () => {
  if (!navigator.gpu) throw new Error("WebGPU unavailable");
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) throw new Error("No WebGPU adapter");
  const features = adapter.features.has("timestamp-query") ? ["timestamp-query"] : [];
  const device = await adapter.requestDevice({requiredFeatures: features});
  window.adapterInfo = {vendor: adapter.info.vendor, architecture: adapter.info.architecture, description: adapter.info.description};
  device.addEventListener("uncapturederror", event => gpuErrors.push(event.error.message));
  device.lost.then(info => gpuErrors.push("device lost: " + info.message));
  return device;
})();
window.renderCase = async (format, alphaMode, discard, phase) => {
  const device = await ready;
  const context = document.querySelector("canvas").getContext("webgpu");
  const configuration = format + "/" + alphaMode;
  if (window.configuration !== configuration) {
    context.unconfigure();
    context.configure({device, format, alphaMode});
    window.configuration = configuration;
  }
  const alpha = alphaMode === "premultiplied" || phase >= 8 ? 0.5 : 1.0;
  const module = device.createShaderModule({code: `
    @vertex fn vertexMain(@builtin(vertex_index) index: u32) -> @builtin(position) vec4<f32> {
      let positions = array<vec2<f32>, 3>(vec2(-1.0, -1.0), vec2(3.0, -1.0), vec2(-1.0, 3.0));
      return vec4(positions[index], 0.0, 1.0);
    }
    @fragment fn fragmentMain(@builtin(position) position: vec4<f32>) -> @location(0) vec4<f32> {
      if ((position.y < 64.0) != ${phase % 2 === 1}) { return vec4(${alpha}, 0.0, 0.0, ${alpha}); }
      return vec4(0.0, 0.0, ${alpha}, ${alpha});
    }`});
  const pipeline = device.createRenderPipeline({layout: "auto",
    vertex: {module, entryPoint: "vertexMain"},
    fragment: {module, entryPoint: "fragmentMain", targets: [{format}]}});
  const encoder = device.createCommandEncoder();
  const pass = encoder.beginRenderPass({colorAttachments: [{
    view: context.getCurrentTexture().createView(), clearValue: [1, 0, 1, 1],
    loadOp: "clear", storeOp: discard ? "discard" : "store"}]});
  pass.setPipeline(pipeline);
  pass.draw(3);
  pass.end();
  device.queue.submit([encoder.finish()]);
  await device.queue.onSubmittedWorkDone();
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  return [...window.gpuErrors];
};
window.benchmark = async count => {
  const device = await ready;
  const canvas = document.querySelector("canvas");
  canvas.width = 1920; canvas.height = 1080;
  const context = canvas.getContext("webgpu");
  context.unconfigure();
  context.configure({device, format: "bgra8unorm", alphaMode: "opaque"});
  const gpuTiming = device.features.has("timestamp-query");
  const queries = gpuTiming ? device.createQuerySet({type: "timestamp", count: 2}) : null;
  const resolved = gpuTiming ? device.createBuffer({size: 256, usage: GPUBufferUsage.QUERY_RESOLVE | GPUBufferUsage.COPY_SRC}) : null;
  const mapped = gpuTiming ? device.createBuffer({size: 16, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ}) : null;
  const samples = [];
  for (let frame = 0; frame < count + 15; ++frame) {
    const tick = await new Promise(requestAnimationFrame);
    const started = performance.now();
    const measure = queries && frame === count + 14;
    const encoder = device.createCommandEncoder();
    const pass = encoder.beginRenderPass({
      colorAttachments: [{view: context.getCurrentTexture().createView(),
        clearValue: [frame % 2, 0, (frame + 1) % 2, 1], loadOp: "clear", storeOp: "store"}],
      ...(measure ? {timestampWrites: {querySet: queries, beginningOfPassWriteIndex: 0, endOfPassWriteIndex: 1}} : {}),
    });
    pass.end();
    if (measure) {
      encoder.resolveQuerySet(queries, 0, 2, resolved, 0);
      encoder.copyBufferToBuffer(resolved, 0, mapped, 0, 16);
    }
    device.queue.submit([encoder.finish()]);
    const submitCpuMs = performance.now() - started;
    let producerGpuMs = null;
    if (measure) {
      await mapped.mapAsync(GPUMapMode.READ);
      const values = new BigUint64Array(mapped.getMappedRange());
      producerGpuMs = Number(values[1] - values[0]) / 1e6;
      mapped.unmap();
    }
    if (frame >= 15) samples.push({tick, submitCpuMs, producerGpuMs,
      completionMs: measure ? performance.now() - started : null});
  }
  await device.queue.onSubmittedWorkDone();
  queries?.destroy(); resolved?.destroy(); mapped?.destroy();
  return {width: canvas.width, height: canvas.height, samples};
};
</script>
