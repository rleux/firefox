[package]
name = "webrender-bindings-gtest"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[features]
vulkan = [
    "dep:bincode", "dep:webrender_bindings", "dep:webrender", "dep:wgpu-hal", "dep:wgpu_bindings", "dep:wgpu-core",
    "dep:wgpu-core-remote", "dep:wgpu-core-remote-types", "dep:wgpu-types",
    "webrender/vulkan",
]

[dependencies]
bincode = { version = "1", optional = true }
webrender = { path = "../../wr/webrender", default-features = false, optional = true }
wgpu-hal = { git = "https://github.com/gfx-rs/wgpu", rev = "49325ca0a13bdc0787b1601138096cce743dd29e", optional = true, default-features = false, features = ["vulkan", "validation_canary"] }

wgpu_bindings = { path = "../../wgpu_bindings", optional = true }
wgpu-core = { git = "https://github.com/gfx-rs/wgpu", rev = "49325ca0a13bdc0787b1601138096cce743dd29e", optional = true }
wgpu-core-remote = { git = "https://github.com/gfx-rs/wgpu", rev = "49325ca0a13bdc0787b1601138096cce743dd29e", optional = true }
wgpu-core-remote-types = { git = "https://github.com/gfx-rs/wgpu", rev = "49325ca0a13bdc0787b1601138096cce743dd29e", optional = true }
wgpu-types = { git = "https://github.com/gfx-rs/wgpu", rev = "49325ca0a13bdc0787b1601138096cce743dd29e", optional = true, features = ["counters"] }

webrender_bindings = { path = "..", optional = true, default-features = false, features = ["vulkan"] }

[lib]
path = "lib.rs"
test = false
doctest = false
