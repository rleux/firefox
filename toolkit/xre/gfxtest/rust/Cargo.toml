[package]
name = "wr_startup_probe"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
mozilla-central-workspace-hack = { version = "0.1", features = ["wr_startup_probe"], optional = true }
raw-window-handle = "0.6"

[dependencies.wgpu-hal]
git = "https://github.com/gfx-rs/wgpu"
rev = "4fe54b0207a2ec7e0d65af900b1218b3c1529699"
default-features = false
features = ["vulkan"]

[dependencies.wgpu-types]
git = "https://github.com/gfx-rs/wgpu"
rev = "4fe54b0207a2ec7e0d65af900b1218b3c1529699"
default-features = false

[dependencies.wgpu-core]
git = "https://github.com/gfx-rs/wgpu"
rev = "4fe54b0207a2ec7e0d65af900b1218b3c1529699"
default-features = false
features = ["vulkan"]

[dependencies.ash]
version = "0.38"
default-features = false
